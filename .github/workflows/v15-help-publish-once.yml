name: One-time approved EDB v15 baseline publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v15-help-publish-once.yml']
permissions:
  contents: write
concurrency:
  group: edb-v15-release-sync
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify approved images, synchronize sources and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/v15-help-publish-once.py
      - name: Commit verified sources and advance source archive tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v15-help-publish-once.yml .github/v15-help-publish-once.py
          git add -- EDB_v15_512k_boot.dsk EDB_v15_512k_tools.dsk EDB_v15_512k_bench.dsk extracted README.md docs
          git diff --cached --stat
          git commit -m "Publish approved final BOOT and compact HELP baselines; synchronize v15 sources and docs"
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/tags/v15 | cut -f1)" = "973bbae6b493003ce0c89c2b7a7d6d965f01b24f"
          git push --force-with-lease=refs/tags/v15:973bbae6b493003ce0c89c2b7a7d6d965f01b24f origin HEAD:refs/tags/v15
          echo "Published main and v15 at $(git rev-parse HEAD)"
